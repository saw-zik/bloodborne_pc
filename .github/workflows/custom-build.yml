
name: Merge PRs and Build Bloodborne

on:
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: "PR numbers separated by commas"
        required: true
        type: string

jobs:
  merge:
    name: Create combined branch
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      branch: ${{ steps.combine.outputs.branch }}

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge selected PRs
        id: combine
        shell: bash
        env:
          PR_NUMBERS: ${{ inputs.pr_numbers }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/Supermedo/bloodborne_pc.git
          git fetch upstream windows

          branch="custom-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch" FETCH_HEAD

          numbers="${PR_NUMBERS//,/ }"

          for pr in $numbers; do
            [[ "$pr" =~ ^[0-9]+$ ]] || {
              echo "Invalid PR number: $pr"
              exit 1
            }

            base=$(gh api \
              "repos/Supermedo/bloodborne_pc/pulls/$pr" \
              --jq '.base.ref')

            if [[ "$base" != "windows" ]]; then
              echo "PR #$pr targets $base, not windows"
              exit 1
            fi

            echo "Merging PR #$pr"

            git fetch upstream "refs/pull/$pr/head"
            git merge --no-ff --no-edit FETCH_HEAD
          done

          git push origin "HEAD:refs/heads/$branch"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Created branch: $branch" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build Windows package
    needs: merge
    runs-on: windows-2022

    permissions:
      contents: read

    steps:
      - name: Checkout combined branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.merge.outputs.branch }}
          submodules: recursive

      - name: Setup MSYS2 CLANG64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          release: false
          update: true
          install: >-
            git
            patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-miniupnpc
            mingw-w64-clang-x86_64-nlohmann-json

      - name: Setup Windows Python
        id: winpy
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
     
      - name: Compile Bloodborne
        shell: msys2 {0}
        run: |
          if bash build.sh; then
            echo "Compilation successful"
          else
            result=$?

            echo "===== COMPILATION FAILED ====="

            if [[ -f out/gpu-build.log ]]; then
              echo "===== LAST 150 LOG LINES ====="
              tail -n 150 out/gpu-build.log
            else
              echo "GPU build log was not created"
            fi

            exit "$result"
          fi

      - name: Upload compilation log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-compilation-log
          path: out/gpu-build.log
          if-no-files-found: warn
      

      - name: Download NVIDIA DLSS SDK
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP "NVIDIA-DLSS"

          git clone --depth 1 `
            https://github.com/NVIDIA/DLSS.git `
            "$sdk"

          $runtime = Join-Path $sdk "lib/Windows_x86_64/rel/nvngx_dlss.dll"
          $license = Join-Path $sdk "LICENSE.txt"

          if (-not (Test-Path $runtime)) {
            throw "NVIDIA DLSS runtime not found"
          }

          if ((Get-Item $runtime).Length -lt 1MB) {
            throw "NVIDIA DLSS runtime is unexpectedly small"
          }

          if (-not (Test-Path $license)) {
            throw "NVIDIA DLSS license not found"
          }

          $cmake = (Get-Command cmake.exe -ErrorAction Stop).Source

          if ($cmake -match '[\\/]msys64[\\/]') {
            throw "Expected native Windows CMake, got: $cmake"
          }

          "DLSS_SDK_ROOT=$sdk" >> $env:GITHUB_ENV
          "CMAKE_EXE_WIN=$cmake" >> $env:GITHUB_ENV

          Write-Host "NVIDIA SDK: $sdk"
          Write-Host "Windows CMake: $cmake"

      - name: Setup MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
          vsversion: "2022"

      - name: Verify MSYS2 paths
        shell: msys2 {0}
        run: |
          echo "MSYS2 location: $(cygpath -w /)"
          test -d /c/msys64/clang64/include/vulkan
          test -d /c/msys64/clang64/include/vk_video

      - name: Build DLSS bridge
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail

          export DLSS_SDK_ROOT="$(cygpath -u "$DLSS_SDK_ROOT")"
          export CMAKE_EXE="$(cygpath -u "$CMAKE_EXE_WIN")"

          echo "Checking Vulkan headers..."

          test -d /c/msys64/clang64/include/vulkan
          test -d /c/msys64/clang64/include/vk_video

          echo "Building NVIDIA DLSS bridge..."

          bash packaging/windows/build_dlss.sh

          echo "Verifying DLSS build outputs..."

          test -s out/bbport_dlss.dll
          test -s out/nvngx_dlss.dll
          test -s out/NVIDIA-DLSS-LICENSE.txt

          echo "DLSS build successful"

      - name: Package Windows build
        shell: msys2 {0}
        env:
          WINPYTHON_WIN: ${{ steps.winpy.outputs.python-path }}
        run: |
          export WINPYTHON="$(cygpath -u "$WINPYTHON_WIN")"
          bash packaging/windows/package.sh
          
      - name: Diagnose DLSS packaging
        shell: pwsh
        run: |
          Write-Host "===== DLSS BUILD OUTPUT ====="

          Get-ChildItem out -Filter "*dlss*" -Recurse |
            Select-Object FullName, Length

          Write-Host "===== PACKAGED DLL FILES ====="

          Get-ChildItem dist -Filter "*.dll" -Recurse |
            Where-Object { $_.Name -match "dlss" } |
            Select-Object FullName, Length    
          

      - name: Verify DLSS in Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zipPath = "dist/bbport-windows.zip"

          if (-not (Test-Path $zipPath)) {
            throw "ZIP archive not found: $zipPath"
          }

          Add-Type -AssemblyName System.IO.Compression

          $archive = [System.IO.Compression.ZipFile]::OpenRead(
            (Resolve-Path $zipPath).Path
          )

          try {
            $entries = @($archive.Entries)

            Write-Host "===== DLSS FILES IN ARCHIVE ====="

            $entries |
              Where-Object { $_.FullName -match "dlss" } |
              ForEach-Object {
                Write-Host "$($_.FullName) ($($_.Length) bytes)"
              }

            $required = @(
              "bbport_dlss.dll",
              "nvngx_dlss.dll"
            )

            foreach ($dll in $required) {
              $found = @(
                $entries | Where-Object {
                  $normalized = $_.FullName.Replace('\', '/')
                  $filename = $normalized.Split('/')[-1]

                  $filename -ieq $dll -and $_.Length -gt 0
                }
              )

              if ($found.Count -eq 0) {
                throw "Missing DLL in archive: $dll"
              }

              foreach ($entry in $found) {
                Write-Host "OK: $($entry.FullName)"
              }
            }

            Write-Host "DLSS verification successful"
          }
          finally {
            $archive.Dispose()
          }


      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bloodborne-custom-windows
          path: dist/bbport-windows.zip
          if-no-files-found: error
